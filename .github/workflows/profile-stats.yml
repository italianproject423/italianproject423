name: Update GitHub Profile

"on":
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - uses: actions/checkout@v6

  - name: Generate stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=italianproject423&show_icons=true&theme=tokyonight
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate top languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=italianproject423&layout=compact&langs_count=6&theme=tokyonight
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "Update GitHub profile stats" || exit 0
      git push
```
